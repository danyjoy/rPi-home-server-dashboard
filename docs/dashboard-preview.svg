<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="system-ui, sans-serif">
  <rect width="820" height="520" fill="#020617"/>
  <rect x="20" y="20" width="780" height="480" rx="14" fill="#0b1120"/>

  <!-- Header -->
  <text x="44" y="56" fill="#f1f5f9" font-size="20" font-weight="700">Command Center</text>
  <text x="44" y="76" fill="#94a3b8" font-size="13">raspberrypi</text>
  <circle cx="720" cy="54" r="5" fill="#22c55e"/>
  <text x="734" y="59" fill="#94a3b8" font-size="13">Online</text>

  <!-- Row 1 -->
  <!-- CPU -->
  <g>
    <rect x="44" y="100" width="232" height="118" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <text x="60" y="124" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="1">CPU</text>
    <rect x="214" y="112" width="48" height="18" rx="9" fill="#22c55e22" stroke="#22c55e55"/>
    <text x="238" y="125" fill="#22c55e" font-size="10" text-anchor="middle">Healthy</text>
    <text x="60" y="162" fill="#f1f5f9" font-size="26" font-weight="700">23%</text>
    <text x="262" y="162" fill="#94a3b8" font-size="11" text-anchor="end">4 cores</text>
    <rect x="60" y="174" width="202" height="8" rx="4" fill="#1e293b"/>
    <rect x="60" y="174" width="47" height="8" rx="4" fill="#22c55e"/>
    <rect x="60" y="192" width="47" height="5" rx="2" fill="#1e293b"/><rect x="60" y="192" width="18" height="5" rx="2" fill="#22c55e"/>
    <rect x="112" y="192" width="47" height="5" rx="2" fill="#1e293b"/><rect x="112" y="192" width="30" height="5" rx="2" fill="#22c55e"/>
    <rect x="164" y="192" width="47" height="5" rx="2" fill="#1e293b"/><rect x="164" y="192" width="12" height="5" rx="2" fill="#22c55e"/>
    <rect x="216" y="192" width="46" height="5" rx="2" fill="#1e293b"/><rect x="216" y="192" width="33" height="5" rx="2" fill="#22c55e"/>
  </g>
  <!-- Memory -->
  <g>
    <rect x="294" y="100" width="232" height="118" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <text x="310" y="124" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="1">MEMORY</text>
    <rect x="464" y="112" width="48" height="18" rx="9" fill="#f59e0b22" stroke="#f59e0b55"/>
    <text x="488" y="125" fill="#f59e0b" font-size="10" text-anchor="middle">Warning</text>
    <text x="310" y="162" fill="#f1f5f9" font-size="26" font-weight="700">76%</text>
    <text x="512" y="162" fill="#94a3b8" font-size="11" text-anchor="end">3.1 GB / 4 GB</text>
    <rect x="310" y="174" width="202" height="8" rx="4" fill="#1e293b"/>
    <rect x="310" y="174" width="154" height="8" rx="4" fill="#f59e0b"/>
  </g>
  <!-- Temp -->
  <g>
    <rect x="544" y="100" width="232" height="118" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <text x="560" y="124" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="1">CPU TEMP</text>
    <rect x="714" y="112" width="48" height="18" rx="9" fill="#22c55e22" stroke="#22c55e55"/>
    <text x="738" y="125" fill="#22c55e" font-size="10" text-anchor="middle">Healthy</text>
    <text x="560" y="168" fill="#f1f5f9" font-size="26" font-weight="700">48.2°C</text>
  </g>

  <!-- Row 2 -->
  <!-- Uptime -->
  <g>
    <rect x="44" y="234" width="232" height="110" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <text x="60" y="258" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="1">UPTIME</text>
    <text x="60" y="300" fill="#f1f5f9" font-size="24" font-weight="700">2d 3h 14m</text>
  </g>
  <!-- Load -->
  <g>
    <rect x="294" y="234" width="232" height="110" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <text x="310" y="258" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="1">LOAD AVERAGE</text>
    <text x="340" y="300" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">0.42</text>
    <text x="340" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">1m</text>
    <text x="410" y="300" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">0.55</text>
    <text x="410" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">5m</text>
    <text x="480" y="300" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">0.60</text>
    <text x="480" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">15m</text>
  </g>
  <!-- System -->
  <g>
    <rect x="544" y="234" width="232" height="110" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <text x="560" y="258" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="1">SYSTEM</text>
    <text x="560" y="282" fill="#94a3b8" font-size="12">Model</text>
    <text x="762" y="282" fill="#e2e8f0" font-size="12" text-anchor="end">Pi 4 Model B</text>
    <text x="560" y="304" fill="#94a3b8" font-size="12">OS</text>
    <text x="762" y="304" fill="#e2e8f0" font-size="12" text-anchor="end">Debian 12 (bookworm)</text>
    <text x="560" y="326" fill="#94a3b8" font-size="12">Host</text>
    <text x="762" y="326" fill="#e2e8f0" font-size="12" text-anchor="end">raspberrypi</text>
  </g>

  <!-- Row 3: Storage -->
  <g>
    <rect x="44" y="360" width="358" height="118" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <text x="60" y="384" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="1">STORAGE · ROOT</text>
    <rect x="330" y="372" width="56" height="18" rx="9" fill="#22c55e22" stroke="#22c55e55"/>
    <text x="358" y="385" fill="#22c55e" font-size="10" text-anchor="middle">Healthy</text>
    <text x="60" y="424" fill="#f1f5f9" font-size="26" font-weight="700">38%</text>
    <text x="386" y="424" fill="#94a3b8" font-size="11" text-anchor="end">/</text>
    <rect x="60" y="436" width="326" height="8" rx="4" fill="#1e293b"/>
    <rect x="60" y="436" width="124" height="8" rx="4" fill="#22c55e"/>
    <text x="60" y="464" fill="#94a3b8" font-size="11">48 GB used</text>
    <text x="223" y="464" fill="#94a3b8" font-size="11" text-anchor="middle">77 GB free</text>
    <text x="386" y="464" fill="#94a3b8" font-size="11" text-anchor="end">125 GB total</text>
  </g>
  <g>
    <rect x="420" y="360" width="356" height="118" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <text x="436" y="384" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="1">STORAGE · MEDIA</text>
    <rect x="704" y="372" width="56" height="18" rx="9" fill="#f59e0b22" stroke="#f59e0b55"/>
    <text x="732" y="385" fill="#f59e0b" font-size="10" text-anchor="middle">Warning</text>
    <text x="436" y="424" fill="#f1f5f9" font-size="26" font-weight="700">82%</text>
    <text x="760" y="424" fill="#94a3b8" font-size="11" text-anchor="end">/mnt/media</text>
    <rect x="436" y="436" width="324" height="8" rx="4" fill="#1e293b"/>
    <rect x="436" y="436" width="266" height="8" rx="4" fill="#f59e0b"/>
    <text x="436" y="464" fill="#94a3b8" font-size="11">1.6 TB used</text>
    <text x="598" y="464" fill="#94a3b8" font-size="11" text-anchor="middle">360 GB free</text>
    <text x="760" y="464" fill="#94a3b8" font-size="11" text-anchor="end">2 TB total</text>
  </g>
</svg>
